<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{% if page.title and page.url != '/' %}{{ page.title }} | {% endif %}{{ site.title }}</title>

  <meta name="description" content="{{ site.description }}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}?v=5">
</head>

<body>

  {% include header.html %}

  <div class="page-shell">

    {% include sidebar.html %}

    <main class="page-content" id="main">
      {{ content }}
    </main>

  </div>

  <footer class="site-footer">
    © {{ 'now' | date: '%Y' }} Jungmin Shin · Last updated {{ site.time | date: '%B %Y' }} · Hosted on GitHub Pages
  </footer>

  <script src="{{ '/assets/js/main.js' | relative_url }}?v=5"></script>

</body>
</html>
